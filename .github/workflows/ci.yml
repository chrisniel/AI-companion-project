name: CI

on:
  push:
    branches:
      - develop
      - master
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Verification (Windows / Python 3.11)
    runs-on: windows-latest
    env:
      COMPANION_API_KEY: ci-ephemeral-test-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Configure isolated runtime root
        shell: pwsh
        run: |
          $dataRoot = Join-Path $env:RUNNER_TEMP "ai-companion-ci"
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          "COMPANION_DATA_ROOT=$dataRoot" >> $env:GITHUB_ENV

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Verify OpenAPI contract and route integrity
        run: python scripts/check_openapi_contract.py

      - name: Run backend pytest suite
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend Verification (Windows / Node 22)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/web/package-lock.json'

      - name: Install frontend dependencies
        run: npm --prefix frontend/web ci

      - name: Run Vitest test suite
        run: npm --prefix frontend/web test -- --run

      - name: Run TypeScript typecheck (lint)
        run: npm --prefix frontend/web run lint

      - name: Run Vite production build
        run: npm --prefix frontend/web run build

  ci-gate:
    name: CI Gate
    needs: [backend, frontend]
    runs-on: windows-latest
    steps:
      - name: Confirm all verification gates passed
        run: echo "All backend and frontend verification gates passed successfully."
