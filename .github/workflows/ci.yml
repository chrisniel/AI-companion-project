name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Every replacement develop/master push requires all lanes for its integrated tree.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classifier:
    name: Path Classification
    runs-on: ubuntu-latest
    outputs:
      needs_backend: ${{ steps.classify.outputs.needs_backend }}
      needs_frontend: ${{ steps.classify.outputs.needs_frontend }}
      needs_contract: ${{ steps.classify.outputs.needs_contract }}
      needs_docs: ${{ steps.classify.outputs.needs_docs }}
      needs_flutter: ${{ steps.classify.outputs.needs_flutter }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify policy script integrity
        run: |
          python -m py_compile scripts/ci_policy.py
          python -m unittest scripts/tests/test_ci_policy.py

      - name: Classify paths
        id: classify
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            target_branch="${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" == "push" ]; then
            target_branch="${{ github.ref_name }}"
          else
            target_branch=""
          fi
          
          # Integration pushes and explicit full runs do not depend on a path diff.
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "$target_branch" == "master" ] || { [ "${{ github.event_name }}" == "push" ] && [ "$target_branch" == "develop" ]; }; then
            python scripts/ci_policy.py classify --event ${{ github.event_name }} --target-branch "$target_branch"
          else
            diff_success="false"
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              if git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > diff.txt; then
                diff_success="true"
              fi
            else
              if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
                if git diff --name-only ${{ github.event.before }}..${{ github.sha }} > diff.txt; then
                  diff_success="true"
                fi
              fi
            fi
            
            if [ "$diff_success" == "true" ] && [ -s diff.txt ]; then
              json_arr=$(python -c 'import sys, json; print(json.dumps(sys.stdin.read().splitlines()))' < diff.txt)
              python scripts/ci_policy.py classify --event ${{ github.event_name }} --target-branch "$target_branch" --files-json "$json_arr"
            else
              echo "Git diff failed, empty, or unresolvable. Falling back to Full Verification."
              python scripts/ci_policy.py classify --event ${{ github.event_name }} --target-branch "$target_branch" --files-json "[]"
            fi
          fi

  docs-integrity:
    name: Docs Integrity
    needs: classifier
    if: needs.classifier.outputs.needs_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Diff
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Workflow dispatch: git diff --check is N/A."
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            git diff --check ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} -- docs/ "*.md" || exit 1
          else
            if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              git diff --check ${{ github.event.before }}..${{ github.sha }} -- docs/ "*.md" || exit 1
            fi
          fi

      - name: Canonical presence checks
        run: |
          test -f "docs/04_Architecture/SYSTEM_BASELINE.md" || { echo "Missing SYSTEM_BASELINE.md"; exit 1; }
          test -f "AGENTS.md" || { echo "Missing AGENTS.md"; exit 1; }
          test -f "docs/06_Guides/DOCUMENTATION_MAP.md" || { echo "Missing DOCUMENTATION_MAP.md"; exit 1; }

  backend:
    name: Backend Verification (Windows x64 / Python 3.11.9)
    needs: classifier
    if: needs.classifier.outputs.needs_backend == 'true'
    runs-on: windows-latest
    env:
      COMPANION_API_KEY: ci-ephemeral-test-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11.9 x64
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.lock'

      - name: Configure isolated runtime root
        shell: pwsh
        run: |
          $dataRoot = Join-Path $env:RUNNER_TEMP "ai-companion-ci"
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          $selectedConfig = Join-Path $dataRoot "synthetic.env"
          Set-Content -LiteralPath $selectedConfig -Value "" -NoNewline
          "COMPANION_DATA_ROOT=$dataRoot" >> $env:GITHUB_ENV
          "COMPANION_ENV_FILE=$selectedConfig" >> $env:GITHUB_ENV
          "LOCALAPPDATA=$dataRoot" >> $env:GITHUB_ENV

      - name: Install and verify locked backend dependencies in a fresh environment
        shell: pwsh
        run: |
          $qualificationRoot = Join-Path $env:RUNNER_TEMP "ai-companion-backend-qualification"
          if (Test-Path -LiteralPath $qualificationRoot) { throw "Qualification environment must be fresh" }
          python -I -B -m venv $qualificationRoot
          if ($LASTEXITCODE -ne 0) { throw "Qualification environment creation failed" }
          $qualificationPython = Join-Path $qualificationRoot "Scripts/python.exe"
          & $qualificationPython -I -B -m pip --isolated uninstall --yes setuptools
          if ($LASTEXITCODE -ne 0) { throw "Seed distribution removal failed" }
          & $qualificationPython -I -B -m pip --isolated install --require-hashes --only-binary=:all: --no-cache-dir --index-url https://pypi.org/simple -r backend/requirements.lock
          if ($LASTEXITCODE -ne 0) { throw "Locked dependency installation failed" }
          & $qualificationPython -I -B scripts/python_dependency_lock.py verify
          if ($LASTEXITCODE -ne 0) { throw "Locked dependency closure verification failed" }
          "QUALIFICATION_PYTHON=$qualificationPython" >> $env:GITHUB_ENV

      - name: Record Python qualification inputs
        shell: pwsh
        run: |
          & $env:QUALIFICATION_PYTHON -VV
          if ($LASTEXITCODE -ne 0) { throw "Interpreter evidence failed" }
          & $env:QUALIFICATION_PYTHON -I -B -m pip --version
          if ($LASTEXITCODE -ne 0) { throw "Installer evidence failed" }
          & $env:QUALIFICATION_PYTHON -I -B -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Installed dependency integrity failed" }

      - name: Verify dependency lock validation regressions
        shell: pwsh
        run: '& $env:QUALIFICATION_PYTHON -I -B scripts/tests/test_python_dependency_lock.py'

      - name: Verify import and collection isolation before the suite
        shell: pwsh
        run: '& $env:QUALIFICATION_PYTHON -I -B backend/tests/test_import_isolation.py -v'

      - name: Run backend pytest suite
        shell: pwsh
        run: '& $env:QUALIFICATION_PYTHON -B -m pytest backend/tests -q -p no:cacheprovider -o log_file=NUL'

  contract:
    name: Contract Verification (Windows x64 / Python 3.11.9)
    needs: classifier
    if: needs.classifier.outputs.needs_contract == 'true'
    runs-on: windows-latest
    env:
      COMPANION_API_KEY: ci-ephemeral-test-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11.9 x64
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.lock'

      - name: Configure isolated contract inputs
        shell: pwsh
        run: |
          $dataRoot = Join-Path $env:RUNNER_TEMP "ai-companion-contract-ci"
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          $selectedConfig = Join-Path $dataRoot "synthetic.env"
          Set-Content -LiteralPath $selectedConfig -Value "" -NoNewline
          "COMPANION_DATA_ROOT=$dataRoot" >> $env:GITHUB_ENV
          "COMPANION_ENV_FILE=$selectedConfig" >> $env:GITHUB_ENV
          "LOCALAPPDATA=$dataRoot" >> $env:GITHUB_ENV

      - name: Install and verify locked contract dependencies in a fresh environment
        shell: pwsh
        run: |
          $qualificationRoot = Join-Path $env:RUNNER_TEMP "ai-companion-contract-qualification"
          if (Test-Path -LiteralPath $qualificationRoot) { throw "Qualification environment must be fresh" }
          python -I -B -m venv $qualificationRoot
          if ($LASTEXITCODE -ne 0) { throw "Qualification environment creation failed" }
          $qualificationPython = Join-Path $qualificationRoot "Scripts/python.exe"
          & $qualificationPython -I -B -m pip --isolated uninstall --yes setuptools
          if ($LASTEXITCODE -ne 0) { throw "Seed distribution removal failed" }
          & $qualificationPython -I -B -m pip --isolated install --require-hashes --only-binary=:all: --no-cache-dir --index-url https://pypi.org/simple -r backend/requirements.lock
          if ($LASTEXITCODE -ne 0) { throw "Locked dependency installation failed" }
          & $qualificationPython -I -B scripts/python_dependency_lock.py verify
          if ($LASTEXITCODE -ne 0) { throw "Locked dependency closure verification failed" }
          "QUALIFICATION_PYTHON=$qualificationPython" >> $env:GITHUB_ENV

      - name: Record Python contract qualification inputs
        shell: pwsh
        run: |
          & $env:QUALIFICATION_PYTHON -VV
          if ($LASTEXITCODE -ne 0) { throw "Interpreter evidence failed" }
          & $env:QUALIFICATION_PYTHON -I -B -m pip --version
          if ($LASTEXITCODE -ne 0) { throw "Installer evidence failed" }
          & $env:QUALIFICATION_PYTHON -I -B -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Installed dependency integrity failed" }

      - name: Verify import and collection isolation before contract generation
        shell: pwsh
        run: '& $env:QUALIFICATION_PYTHON -I -B backend/tests/test_import_isolation.py -v'

      - name: Verify OpenAPI contract and route integrity
        shell: pwsh
        run: '& $env:QUALIFICATION_PYTHON -B scripts/check_openapi_contract.py --check'

      - name: Verify Dart OpenAPI contract parity and route implementation coverage
        shell: pwsh
        run: '& $env:QUALIFICATION_PYTHON -B scripts/check_dart_openapi_parity.py --check'

      - name: Run Dart OpenAPI parity test suite
        shell: pwsh
        run: '& $env:QUALIFICATION_PYTHON -B -m unittest scripts/tests/test_check_dart_openapi_parity.py'

  frontend:
    name: Frontend Verification (Windows / Node 22.22.2)
    needs: classifier
    if: needs.classifier.outputs.needs_frontend == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22.22.2
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: 'frontend/web/package-lock.json'

      - name: Record Node qualification inputs
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        run: npm --prefix frontend/web ci

      - name: Run Vitest test suite
        run: npm --prefix frontend/web test -- --run

      - name: Run TypeScript typecheck (lint)
        run: npm --prefix frontend/web run lint

      - name: Run Vite production build
        run: npm --prefix frontend/web run build

  flutter:
    name: Flutter Desktop Verification (Windows / Flutter 3.47.1)
    needs: classifier
    if: needs.classifier.outputs.needs_flutter == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.1'
          cache: true

      - name: Record Flutter qualification inputs
        shell: pwsh
        run: |
          flutter --version
          if ($LASTEXITCODE -ne 0) { throw "Flutter version check failed" }
          dart --version
          if ($LASTEXITCODE -ne 0) { throw "Dart version check failed" }

      - name: Resolve Flutter workspace dependencies
        working-directory: frontend/flutter
        run: flutter pub get

      - name: Verify workspace member layout
        working-directory: frontend/flutter
        run: dart pub workspace list

      - name: Verify Dart OpenAPI contract parity
        run: python scripts/check_dart_openapi_parity.py --check

      - name: Static analysis
        working-directory: frontend/flutter
        run: dart analyze .

      - name: Run companion_core unit tests
        working-directory: frontend/flutter
        run: flutter test packages/companion_core/test

      - name: Run companion_api unit tests
        working-directory: frontend/flutter
        run: flutter test packages/companion_api/test

      - name: Run companion_design unit tests
        working-directory: frontend/flutter
        run: flutter test packages/companion_design/test

      - name: Run desktop application widget tests
        working-directory: frontend/flutter
        run: flutter test apps/desktop/test

      - name: Build Windows desktop debug runner
        working-directory: frontend/flutter/apps/desktop
        run: flutter build windows --debug

  ci-gate:
    name: CI Gate
    if: always()
    needs: [classifier, backend, frontend, contract, docs-integrity, flutter]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Evaluate Gates
        run: |
          python scripts/ci_policy.py gate \
            --classifier-status "${{ needs.classifier.result }}" \
            --requirements-json '{"needs_backend": "${{ needs.classifier.outputs.needs_backend }}", "needs_frontend": "${{ needs.classifier.outputs.needs_frontend }}", "needs_contract": "${{ needs.classifier.outputs.needs_contract }}", "needs_docs": "${{ needs.classifier.outputs.needs_docs }}", "needs_flutter": "${{ needs.classifier.outputs.needs_flutter }}"}' \
            --results-json '{"backend": "${{ needs.backend.result }}", "frontend": "${{ needs.frontend.result }}", "contract": "${{ needs.contract.result }}", "docs_integrity": "${{ needs.docs-integrity.result }}", "flutter": "${{ needs.flutter.result }}"}'
